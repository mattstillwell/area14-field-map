<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area 14 Cutting Re-inspection Field Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif}
#panel{position:absolute;z-index:1000;top:10px;right:10px;width:min(370px,calc(100vw - 20px));background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 10px #0004;max-height:46vh;overflow:auto}
#panel h2{font-size:17px;margin:0 0 8px}.row{display:flex;gap:7px;margin:5px 0;flex-wrap:wrap}input,select,button{font-size:14px;padding:7px}input[type=text]{flex:1;min-width:150px}button{cursor:pointer}.legend span{display:inline-block;margin-right:10px;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px}.count{font-size:13px;font-weight:bold;margin-top:6px}.popup table{border-collapse:collapse;font-size:12px}.popup td{padding:2px 5px;vertical-align:top;border-bottom:1px solid #eee}.popup a.gmap{display:inline-block;margin-top:8px;padding:7px 10px;background:#1a73e8;color:white;text-decoration:none;border-radius:4px}#loading{position:absolute;z-index:1200;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font-size:18px}@media (max-width:650px){#panel{max-height:38vh}}
</style>
</head>
<body>
<div id="loading">Loading Area 14 survey map…</div>
<div id="panel">
<h2>Area 14 - Cutting Re-inspection</h2>
<div class="row"><input id="search" type="text" placeholder="Search ID, W3W, marker post, species..."><button onclick="applyFilters()">Search</button></div>
<div class="row">
<select id="action" onchange="applyFilters()"><option value="">Cutting + re-survey</option><option value="Cutting Work" selected>Cutting only</option><option value="Re-survey / Monitoring">Re-survey only</option></select>
<select id="route" onchange="applyFilters()"><option value="">All routes</option><option>A168</option><option>A19</option><option>A194M-A19</option><option>A1M</option><option>A66</option><option>A696</option></select>
<select id="priority" onchange="applyFilters()"><option value="">All priorities</option><option>Safety Critical</option><option>High Priority</option><option>Medium Priority</option><option>Low Priority</option></select>
</div>
<div class="row"><button onclick="locateMe()">Locate me</button><button onclick="resetMap()">Reset view</button></div>
<div class="legend"><span><i class="dot" style="background:#8e44ad"></i>Safety Critical</span><span><i class="dot" style="background:#d73027"></i>High</span><span><i class="dot" style="background:#f39c12"></i>Medium</span><span><i class="dot" style="background:#2e8b57"></i>Low</span><span><i class="dot" style="background:#2980b9"></i>Re-survey</span></div>
<div id="count" class="count"></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="data01.js"></script><script src="data02.js"></script><script src="data03.js"></script><script src="data04.js"></script><script src="data05.js"></script><script src="data06.js"></script><script src="data07.js"></script><script src="data08.js"></script><script src="data09.js"></script><script src="data10.js"></script><script src="data11.js"></script><script src="data12.js"></script><script src="data13.js"></script><script src="data14.js"></script><script src="data15.js"></script><script src="data16.js"></script><script src="data17.js"></script><script src="data18.js"></script><script src="data19.js"></script><script src="data20.js"></script><script src="data21.js"></script><script src="data22.js"></script><script src="data23.js"></script><script src="data24.js"></script>
<script>
const DATA=[].concat(...(window.AREA14_PARTS||[]));
const map=L.map('map').setView([54.9,-1.65],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let cluster=L.markerClusterGroup({disableClusteringAtZoom:15});map.addLayer(cluster);let locLayer=null;
function colour(r){if(r.action!=='Cutting Work')return'#2980b9';if(r.priority==='Safety Critical')return'#8e44ad';if(r.priority==='High Priority')return'#d73027';if(r.priority==='Medium Priority')return'#f39c12';return'#2e8b57'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function popup(r){const rows=[['Action',r.action],['Priority',r.priority],['Work',r.work],['Other / Re-survey',r.other],['Route',r.route],['Direction',r.direction],['Marker posts',r.mp],['No. trees',r.trees],['Species',r.species],['ADB class',r.adb],['Defect 1',r.d1],['Defect 2',r.d2],['Defect 3',r.d3],['Site hazards',r.hazards],['Notes',r.notes],['W3W',r.w3w],['Survey ID',r.id]].filter(x=>x[1]);const trs=rows.map(x=>`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td></tr>`).join('');const gm=`https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}`;const w3=r.w3w?` &nbsp; <a target="_blank" rel="noopener" href="https://what3words.com/${encodeURIComponent(r.w3w)}">what3words</a>`:'';return `<div class="popup"><b>${esc(r.name)}</b><table>${trs}</table><a class="gmap" target="_blank" rel="noopener" href="${gm}">Open in Google Maps</a>${w3}</div>`}
function applyFilters(){cluster.clearLayers();const q=document.getElementById('search').value.trim().toLowerCase(),a=document.getElementById('action').value,route=document.getElementById('route').value,pri=document.getElementById('priority').value;const filtered=DATA.filter(r=>{if(a&&r.action!==a)return false;if(route&&r.route!==route)return false;if(pri&&r.priority!==pri)return false;if(q){const hay=[r.id,r.name,r.w3w,r.mp,r.species,r.work,r.route,r.direction].join(' ').toLowerCase();if(!hay.includes(q))return false}return true});filtered.forEach(r=>{const m=L.circleMarker([r.lat,r.lon],{radius:7,color:colour(r),fillColor:colour(r),fillOpacity:.9,weight:1.5});m.bindPopup(popup(r),{maxWidth:390});cluster.addLayer(m)});document.getElementById('count').textContent=`Showing ${filtered.length.toLocaleString()} survey locations`;if(filtered.length&&(q||route||pri||a==='Re-survey / Monitoring'))map.fitBounds(L.latLngBounds(filtered.map(r=>[r.lat,r.lon])).pad(.08))}
function locateMe(){if(!navigator.geolocation)return alert('Location is not available in this browser.');navigator.geolocation.getCurrentPosition(p=>{if(locLayer)map.removeLayer(locLayer);locLayer=L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:9,color:'#000',fillColor:'#fff',fillOpacity:1,weight:3}).addTo(map).bindPopup('Your location').openPopup();map.setView([p.coords.latitude,p.coords.longitude],16)},e=>alert('Unable to access your location: '+e.message),{enableHighAccuracy:true})}
function resetMap(){document.getElementById('search').value='';document.getElementById('route').value='';document.getElementById('priority').value='';document.getElementById('action').value='Cutting Work';applyFilters();const d=DATA.filter(r=>r.action==='Cutting Work');if(d.length)map.fitBounds(L.latLngBounds(d.map(r=>[r.lat,r.lon])).pad(.03))}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters()});applyFilters();resetMap();document.getElementById('loading').style.display='none';
</script>
</body></html>
